[package]
name = "polaris-app"
version = "0.1.0"
description = "Polaris desktop shell (Owner A: hotkey, audio, Touch ID, event stream)"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
# Tauri v2 mobile prep: the app is a library plus a thin binary.
name = "polaris_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# `macos-private-api` is required for the transparent notch overlay
# (`app.macOSPrivateApi` in tauri.conf.json is only a declaration; the runtime
# transparency call is compiled out without this cargo feature).
tauri = { version = "2.11.5", features = ["macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Step W3: the Touch ID gate binds an approval to the exact unsigned XDR by its
# SHA-256 digest, matching `payloadHashOfXdr` in the agent (W1). `sha2`/`hex`
# are the same versions already present transitively (see Cargo.lock).
sha2 = "0.10"
hex = "0.4"

# Step A0: microphone capture (cpal) written to 16-bit PCM WAV (hound), and the
# global push-to-talk shortcut. The plugin is desktop-only by design.
cpal = "0.18"
hound = "3.5"
tauri-plugin-global-shortcut = "2.3"

# Step A1: cloud speech-to-text. `blocking` keeps the call off the async runtime
# and on the STT worker thread; `native-tls` uses the macOS system trust store
# (no bundled crypto), and multipart bodies are built by hand (see stt/groq.rs)
# so the exact request shape is unit-testable.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }

# Step W4b: signing helpers. The XDR is verified without an XDR crate: `base64`
# decodes the envelope, `sha2`/`hex` compute the transaction hash, and
# `ed25519-dalek` (audited) verifies the owner's signature.
#
# `ed25519-dalek` is pinned to exactly 2.1.1: 2.2.0 raises the MSRV to 1.81,
# above this crate's declared `rust-version = "1.77"` (2.1.1 needs 1.60).
ed25519-dalek = "=2.1.1"
base64 = "0.23"
getrandom = "0.3"

# Step W10: the wallet inside the app. `bip39` generates and parses the 24-word
# recovery phrase; `hmac`/`sha2` implement SLIP-0010 ed25519 derivation for the
# SEP-5 path `m/44'/148'/index'` (no separate derivation crate needed).
# `zeroize` wipes the seed and phrase buffers after use; the `zeroize` feature
# also wipes the parsed mnemonic's word indices.
bip39 = { version = "2.1", features = ["zeroize"] }
hmac = "0.12"
zeroize = "1.8"

# Step W11a: `executor_sign_pay` decodes the Soroban invocation itself, so the
# executor key can sign ONLY the guard's `pay_executor` call. Decoding arbitrary
# XDR by hand is exactly where a parser bug becomes a signature over a different
# transaction, so this uses the audited `stellar-xdr` reader instead of the
# parse-free envelope slicing the bridge uses. `base64` gates `from_xdr_base64`;
# the default `std` face is left off to keep the feature surface minimal (28.x
# dropped the old `curr` feature — the generated types ARE the current protocol).
stellar-xdr = { version = "28", default-features = false, features = ["base64"] }

# The overlay's window level / collection behaviour come from AppKit directly,
# because Tauri's window API does not expose them. Versions are pinned to the
# objc2 generation tauri 2.11 already links (see `cargo tree -i objc2`); a
# mismatched major would link two incompatible objc2 crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# `NSRunningApplication` reads back the app's activation policy for the notch
# diagnostics (step A15); `NSWorkspace`/`NSRunningApplication` are also how the
# folded prompt hands keyboard focus back to the app the user came from when it
# closes.
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSWorkspace", "NSRunningApplication", "NSApplication"] }
# `NSGeometry` carries NSPoint/NSRect/NSSize/NSEdgeInsets; `NSEnumerator`
# unlocks NSArray::iter, used to scan screens for the notched display.
# Step W3 adds `NSString`/`NSError` for the LocalAuthentication prompt and its
# error mapping.
objc2-foundation = { version = "0.3", features = ["NSEnumerator", "NSGeometry", "NSString", "NSError"] }
# Step A1 on-device backend: the macOS Speech framework (`SFSpeechRecognizer`).
# Same objc2 0.6.x generation as the app-kit/foundation crates above (see
# `cargo tree -i objc2`); the default features are left on so the generated
# classes the backend uses are all present, and `objc2-avf-audio` /
# `objc2-core-media` come along as harmless same-generation transitives.
# `block2` provides the result-handler block.
objc2-speech = "0.3"
# Step W3: the Touch ID / device-password approval gate
# (`LAContext.evaluatePolicy`). Same objc2 0.6.x generation as the crates above.
# Default features are turned off on purpose: they drag in `objc2-security`,
# which this gate does not use (`evaluatePolicy` needs neither Keychain nor
# access-control objects), and which is not otherwise linked by the app.
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LABiometryType", "LAContext", "LAError", "block2"] }
# Modifier-only Control+Option hold: an `NSEvent` flagsChanged monitor pair
# needs the Objective-C block runtime (`block2`, already a default feature of
# objc2-app-kit for NSEvent) and a CoreFoundation dictionary for the
# Accessibility consent prompt.
block2 = "0.6"
core-foundation = "0.10"
# First-run onboarding: the microphone TCC status and prompt
# (`AVCaptureDevice.authorizationStatusForMediaType:` /
# `requestAccessForMediaType:completionHandler:`). Same objc2 0.6.x generation
# as the crates above. Default features are off so the capture-device surface
# does not drag in `objc2-image-io` / `objc2-media-toolbox`, which onboarding
# never touches.
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }

# Step W10: the embedded wallet's seed storage. `security-framework`'s
# generic-password API stores each seed as a login-Keychain item (service
# `dev.polaris.wallet`, account `signer-<address>`). Data-protection /
# biometric ACLs need entitlements an ad-hoc dev build lacks, so the item is a
# plain generic password; macOS may show a one-time "Always Allow" prompt when
# the app's ad-hoc signature changes between builds.
security-framework = "3"
